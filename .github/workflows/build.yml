name: Build APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.apk.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # Full history, to count main's commits for the version.
          fetch-depth: 0

      # The version people see only moves when something lands on main:
      # 1.0.X, where X counts main's commits (one per merged PR). Other
      # branches show the main version they're built on plus the run number,
      # 1.0.X-RUN. The hidden versionCode is the run number either way, so
      # every APK, from any branch, installs over the last one.
      - name: Work out the version
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            version="1.0.$(git rev-list --count --first-parent HEAD)"
          else
            base="$(git merge-base HEAD origin/main)"
            version="1.0.$(git rev-list --count --first-parent "$base")-${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION_NAME=${version}" >> "$GITHUB_ENV"
          echo "Version ${version} (code ${GITHUB_RUN_NUMBER})"

      # The repo is public, so the sideload key lives in two secrets:
      # SIGNING_KEYSTORE_BASE64 (the keystore, base64) and SIGNING_PASSWORD.
      # Without them the APK is signed with a throwaway debug key: it installs,
      # but can't update one signed with the real key (and vice versa).
      - name: Unpack the signing key
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$PASSWORD" ]; then
            mkdir -p signing
            echo "$KEYSTORE" | base64 -d > signing/sideload.keystore
            echo "SIGNING_PASSWORD=${PASSWORD}" >> "$GITHUB_ENV"
            echo "Signing with the sideload key"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 / SIGNING_PASSWORD aren't set, so this APK is signed with a debug key and won't update one signed with the real key."
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and build the release APK
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Name the APK after its version
        id: apk
        run: |
          version="${VERSION_NAME}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/mergers-fyi-${version}.apk"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: mergers-fyi-${{ steps.apk.outputs.version }}
          path: dist/
          retention-days: 7

      # The UI test drives every screen and saves a PNG of each.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: app/build/screenshots/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            app/build/reports/
            build/reports/
          retention-days: 7
          if-no-files-found: ignore

  # The release APK, after R8, opened on a real Android emulator. Nothing is
  # published unless the app starts and stays up.
  launch:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # The only Android the app supports: 17 (API 37). Its image boots slowly
      # on the runner, so it gets longer than the usual 10 minutes.
      IMAGE: "system-images;android-37.0;google_apis;x86_64"
      BOOT_MINUTES: "20"
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: mergers-fyi-${{ needs.build.outputs.version }}
          path: dist/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on the emulator
        run: .github/scripts/smoke-test.sh "$IMAGE" dist/mergers-fyi-${{ needs.build.outputs.version }}.apk launch/

      - name: Upload screenshot and logcat
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: launch
          path: launch/
          retention-days: 7
          if-no-files-found: ignore

  # A release per main build is the easy way onto the phone: open the repo's
  # Releases page in the phone's browser and tap the .apk. Other branches
  # stop at the APK artifact.
  publish:
    needs: [build, launch]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: mergers-fyi-${{ needs.build.outputs.version }}
          path: dist/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          subject="$(git log -1 --pretty=%s)"
          gh release create "v${VERSION}" "dist/mergers-fyi-${VERSION}.apk" \
            --target "$GITHUB_SHA" \
            --title "mergers.fyi ${VERSION}" \
            --notes "Built from \`main\` at ${GITHUB_SHA::7}: ${subject}"

      # Keep the Releases page short: the ten newest builds.
      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --yes --cleanup-tag
          done
