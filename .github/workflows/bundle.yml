name: Build AAB

# Manual only: builds the release app bundle (for Play) and keeps it for a day.
# No tests, no emulator, no release.
on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out the version
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            version="1.0.$(git rev-list --count --first-parent HEAD)"
          else
            base="$(git merge-base HEAD origin/main)"
            version="1.0.$(git rev-list --count --first-parent "$base")-${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION_NAME=${version}" >> "$GITHUB_ENV"
          echo "Version ${version} (code ${GITHUB_RUN_NUMBER})"

      - name: Unpack the signing key
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$PASSWORD" ]; then
            mkdir -p signing
            echo "$KEYSTORE" | base64 -d > signing/sideload.keystore
            echo "SIGNING_PASSWORD=${PASSWORD}" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets, so this AAB is signed with a debug key."
          fi

      - name: Write the Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build the release AAB
        run: ./gradlew bundleRelease --stacktrace

      - name: Name the AAB after its version
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab "dist/mergers-fyi-${VERSION_NAME}.aab"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: mergers-fyi-${{ env.VERSION_NAME }}-aab
          path: dist/
          retention-days: 1
